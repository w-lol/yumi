name: Windows installer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the installer as a prerelease asset (main branch only)
        type: boolean
        default: false
      release_tag:
        description: New release tag, required only when publishing (for example yumi-v0.1.0-dev.1)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Backend bundle contains add-on sources; Unity binaries are built locally.
          sparse-checkout: |
            /*
            !/avatar-unity/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned Windows dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-windows.lock
      - name: Check native imports
        env:
          ORT_DISABLE_TELEMETRY: '1'
        run: python -c "import onnxruntime; onnxruntime.disable_telemetry_events(); import PySide6.QtWidgets, sherpa_onnx, sounddevice, faster_whisper, cv2, mss, sqlite3"
      - name: Validate PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/setup.ps1', 'scripts/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Run unit and installer tests
        run: python scripts/run_tests.py
      - name: Validate read-only Unity inspection tools
        shell: powershell
        run: ./scripts/validate_unity_inspection.ps1
      - name: Compile and test Unity-side Windows geometry and motion
        run: |
          dotnet run --project integrations/unity/Tests/GeometryTests.csproj --configuration Release 2>&1 | Tee-Object -Variable Result
          $Code = $LASTEXITCODE
          if ($Code -ne 0) {
            $Message = ($Result -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$Message"
            exit $Code
          }
      - name: Validate real Kokoro voices in memory
        run: python scripts/validate_voice.py --root "$env:RUNNER_TEMP/Yumi Kokoro validation" --prepare --output docs/validation/kokoro-windows.json
      - name: Build Windows installer bundle
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: python scripts/package_installer.py --output dist --revision "$env:BUILD_REVISION"
      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Yumi-Windows-installer
          path: |
            dist/Yumi.zip
            dist/Yumi.zip.sha256
            dist/Update-Yumi.ps1
          if-no-files-found: error
          retention-days: 30
      - name: Explain download and validation scope
        shell: pwsh
        run: |
          @'
          ### Windows installer bundle
          Download **Yumi-Windows-installer** from this run's Artifacts section.
          Extract the artifact once to obtain **Yumi.zip**, its SHA-256 file and **Update-Yumi.ps1**.
          Close Yumi, then run `powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Update-Yumi.ps1`.
          Follow **docs/INSTALL.md** inside Yumi.zip for setup.

          This is the existing PowerShell bootstrap installer, not an MSI or signed EXE.
          Setup downloads the pinned runtime and models on the destination PC.
          CI validates Windows imports, PowerShell syntax, tests and packaging.
          It does not validate GPU inference, full installation or physical devices.
          '@ >> $env:GITHUB_STEP_SUMMARY

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^yumi-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo 'Supply a new tag such as yumi-v0.1.0-dev.1.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Yumi-Windows-installer
          path: dist
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_REVISION: ${{ github.sha }}
        run: |
          cd dist
          sha256sum --check Yumi.zip.sha256
          printf '%s\n' 'Windows development installer built by GitHub Actions.' \
            'Download Yumi.zip and follow docs/INSTALL.md inside it.' \
            'Setup downloads the pinned runtime and models. GPU and physical-device acceptance remain pending.' > release-notes.txt
          gh release create "$RELEASE_TAG" Yumi.zip Yumi.zip.sha256 Update-Yumi.ps1 \
            --target "$BUILD_REVISION" --prerelease --title "Yumi $RELEASE_TAG" \
            --notes-file release-notes.txt
